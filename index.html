<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <title>Lap One</title>
    <style>
      :root { color-scheme: dark; --bg: #101820; --panel: rgba(16, 24, 32, 0.92); --line: #2c3e50; --text: #eef3f7; --muted: #9fb0bf; --accent: #ffb300; --accent-text: #1a1a1a; --neg: #ff6b6b; --pos: #6bd98a; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      #ui > .fade { pointer-events: none; }
      .screen { position: absolute; inset: 0; overflow-y: auto; padding: 16px; box-sizing: border-box; background: linear-gradient(160deg, #15202b, #0b1118); padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
      .screen[hidden] { display: none; }
      .screen > :not(.bg-race) { position: relative; z-index: 1; }
      .garage-layout { display: flex; flex-direction: column; gap: 12px; max-width: 980px; margin: 0 auto; }
      .garage-view { position: relative; height: 240px; border-radius: 14px; overflow: hidden; background: radial-gradient(ellipse at center, #1f2b38, #0b1118 75%); border: 1px solid var(--line); }
      .garage-view canvas { display: block; width: 100%; height: 100%; }
      .garage-list { flex: 1; min-width: 0; }
      .garage-list > .card, .garage-list > section { max-width: none; }
      @media (min-width: 760px) {
        .garage-layout { flex-direction: row; align-items: flex-start; }
        .garage-view { position: sticky; top: 12px; flex: 0 0 42%; height: 380px; order: -1; }
      }
      .fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 40; transition: opacity 0.8s ease; }
      .fade.on { opacity: 1; transition: opacity 0.8s ease-in; }
      .fade:not(.on) { transition: opacity 0.8s ease-out 0.2s; }
      .splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, #1a2633, #0b1118 70%); transition: opacity 0.6s ease; }
      .splash.out { opacity: 0; pointer-events: none; }
      .splash-logo svg { display: block; width: min(560px, 84vw); height: auto; animation: logo-in 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.6)); }
      .splash-hint { font-size: 13px; color: var(--muted); letter-spacing: 2px; animation: hint-in 0.6s ease 1s both; }
      @keyframes logo-in { from { opacity: 0; transform: scale(0.7) translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes hint-in { from { opacity: 0; } to { opacity: 1; } }
      .bg-race { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; overflow: hidden; pointer-events: none; z-index: 0; }
      .bg-race canvas { display: block; width: 100%; height: 100%; }
      .hero { position: relative; text-align: center; padding: 28px 0 12px; overflow: hidden; }
      .speed-lines { position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
        background: repeating-linear-gradient(115deg, transparent 0 18px, rgba(255, 179, 0, 0.5) 18px 20px, transparent 20px 46px, rgba(103, 232, 249, 0.4) 46px 48px, transparent 48px 90px); }
      .kicker { position: relative; font-size: 12px; font-weight: 800; letter-spacing: 6px; color: var(--muted); }
      .title { position: relative; margin: 6px 0 0; font-style: italic; font-weight: 900; letter-spacing: 2px; line-height: 1; font-size: 64px; transform: skewX(-8deg); text-transform: uppercase; }
      .title-main { background: linear-gradient(180deg, #ffe082, #ffb300 55%, #ff6f00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #3b2600); }
      .title-num { background: linear-gradient(180deg, #ffffff, #9ee7ff 60%, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #0b2a4a); }
      .event-banner { position: relative; margin: 10px auto 0; max-width: 420px; padding: 8px 12px; border-radius: 10px; background: linear-gradient(90deg, #ff7a1a, #ffb300); color: #111; font-weight: 800; font-size: 14px; }
      .tag.hot { background: #ff3d00; color: #fff; }
      .tagline { position: relative; margin: 12px 0 0; font-size: 13px; letter-spacing: 3px; color: #cfd8e3; text-shadow: 0 2px 6px #000; }
      .title-card { display: flex; justify-content: space-around; gap: 8px; margin: 16px auto 4px; max-width: 420px; padding: 12px 10px; border-radius: 14px; background: rgba(12, 18, 26, 0.7); border: 1px solid rgba(255, 179, 0, 0.35); backdrop-filter: blur(4px); }
      .title-card div { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
      .title-card b { font-size: 15px; }
      .title-card .gold { color: #ffb300; }
      .checker { position: relative; height: 14px; margin: 14px auto 0; width: min(360px, 80vw); transform: skewX(-8deg);
        background: repeating-conic-gradient(#f5f5f5 0% 25%, #111 0% 50%) 50% / 14px 14px; border-top: 2px solid #ffb300; border-bottom: 2px solid #ffb300; }
      .btn.race-btn { background: linear-gradient(90deg, #ff6f00, #ffb300); color: #1a1000; border: none; font-weight: 900; font-style: italic; letter-spacing: 1px; transform: skewX(-6deg); box-shadow: 0 6px 0 #7a3b00; }
      .btn.race-btn:active { transform: skewX(-6deg) translateY(3px); box-shadow: 0 3px 0 #7a3b00; }
      h2 { margin: 12px 0; } h3 { margin: 8px 0; font-size: 15px; color: var(--muted); }
      .coin { color: var(--accent); text-align: center; margin: 8px 0 16px; }
      .coin b { font-size: 20px; }
      .menu { display: flex; flex-direction: column; gap: 12px; max-width: 420px; margin: 16px auto; }
      .btn { background: #22313f; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px; min-height: 48px; cursor: pointer; }
      .btn.big { font-size: 18px; }
      .btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
      .btn.danger { background: #5a1f24; border-color: var(--neg); color: #ffd6d6; }
      .btn[disabled], .btn-small[disabled] { opacity: 0.4; cursor: not-allowed; }
      .btn-small { background: #22313f; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; min-height: 36px; cursor: pointer; }
      .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px auto; max-width: 560px; box-sizing: border-box; }
      .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
      .card .btn { width: 100%; margin-top: 8px; }
      .tag { font-size: 12px; background: #2c3e50; padding: 2px 8px; border-radius: 999px; }
      .muted { color: var(--muted); font-size: 13px; margin: 2px 0; }
      .best { font-size: 13px; color: var(--muted); margin: 4px 0; }
      .note, .warn { color: var(--muted); font-size: 13px; text-align: center; }
      .warn { color: var(--neg); }
      .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); gap: 8px; }
      .row.total { font-size: 18px; }
      section { max-width: 560px; margin: 8px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-sizing: border-box; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
      .stat { display: flex; justify-content: space-between; font-size: 14px; }
      .pos { color: var(--pos); } .neg { color: var(--neg); }
      .hud { position: absolute; inset: 0; pointer-events: none; }
      .hud[hidden] { display: none; }
      .hud button { pointer-events: auto; }
      .hud-top { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px; display: flex; gap: 8px; align-items: center; }
      .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--text); }
      .hud-top .btn-small { margin-left: auto; }
      .gauge { position: absolute; top: 58px; width: 120px; height: 120px; pointer-events: none; }
      .gauge-left { left: 10px; }
      .gauge-right { right: 10px; }
      .hud.first-person .gauge { transform: scale(0.55); transform-origin: top; opacity: 0.5; }
      .hud.first-person .gauge-left { left: 0; }
      .hud.first-person .gauge-right { right: 0; }
      .hud.first-person .redwarn { opacity: 0.6; }
      .gauge svg { display: block; }
      .screen.title-photo { background: linear-gradient(rgba(11, 17, 24, 0.15), rgba(11, 17, 24, 0.75)), url('./images/title-bg.jpg') center / cover no-repeat; }
      #ui.preview > .screen { background: rgba(11, 17, 24, 0.3); }
      #ui.preview .card { background: rgba(16, 24, 32, 0.45); }
      .slider { display: block; margin: 8px 0; }
      .cat-chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; }
      .chip-btn { flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; border: 1px solid #2c3e50; background: #1e2a36; color: #eef3f7; font-size: 13px; }
      .cat-chips.level-chips { display: flex; gap: 6px; overflow-x: auto; }
      .cat-chips.level-chips .chip-btn { flex: 0 0 auto; padding: 8px 14px; font-size: 14px; }
      .cat-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; overflow: visible; }
      .cat-chips .chip-btn { padding: 14px 8px; font-size: 15px; font-weight: 700; border-radius: 12px; text-align: center; }
      .view-toggle { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 2; }
      .view-btn { padding: 8px 14px; border-radius: 999px; border: 1px solid #2c3e50; background: rgba(16,24,32,0.7); color: #eef3f7; font-size: 14px; font-weight: 700; }
      .view-btn.on { background: #ffb300; color: #111; border-color: #ffb300; }
      .chip-btn.on { background: #ffb300; color: #111; border-color: #ffb300; }
      .course-card { display: flex; gap: 12px; align-items: stretch; }
      .course-map { flex: 0 0 110px; display: flex; align-items: center; justify-content: center; background: #0b1620; border-radius: 10px; }
      .course-map svg { width: 100px; height: 100px; }
      .course-info { flex: 1; min-width: 0; }
      .switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #2c3e50; background: #1e2a36; color: #eef3f7; font-size: 15px; text-align: left; }
      .switch { position: relative; flex-shrink: 0; width: 52px; height: 30px; border-radius: 15px; background: #3b4a5a; transition: background 0.2s; }
      .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
      .switch.on { background: #ffb300; }
      .switch.on::after { transform: translateX(22px); }
      .slider span { display: block; font-size: 14px; margin-bottom: 4px; }
      .slider input { width: 100%; }
      .redwarn { position: absolute; top: 184px; left: 10px; width: 120px; text-align: center; font-size: 12px; font-weight: 700; color: #ff5252; text-shadow: 0 1px 4px #000; pointer-events: none; }
        .center { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font-weight: 900; color: #fff; text-shadow: 0 3px 10px #000; pointer-events: none; }
      .finish-banner { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); text-align: center; pointer-events: none; white-space: nowrap; animation: fbIn 0.6s cubic-bezier(.2,1.4,.4,1) both; }
      .fb-flag { height: 16px; width: min(320px, 70vw); margin: 0 auto 10px; background: repeating-conic-gradient(#ffffff 0 25%, #111 0 50%) 0 0 / 32px 32px; border: 2px solid #111; }
            .fb-main { position: relative; font-size: 72px; font-weight: 900; font-style: italic; color: #fff; text-shadow: 0 0 24px #ffd23f, 0 4px 14px #000; letter-spacing: 4px; overflow: hidden; }
      .fb-main span { display: inline-block; background: linear-gradient(180deg, #fff6c2, #ffd23f 55%, #ff9a1a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 0 #3b2600); }
      .fb-main::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.85), transparent); animation: fbShine 1.4s ease-in-out 0.5s both; }
      .fb-burst { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,210,63,.85) 0%, rgba(255,122,26,.35) 35%, transparent 65%); animation: fbBurst 1.2s ease-out both; }
      .fb-confetti { position: absolute; left: -50vw; right: -50vw; top: -220px; height: 760px; pointer-events: none; }
      .fb-confetti i { position: absolute; top: 0; width: 10px; height: 16px; border-radius: 2px; opacity: 0; animation: fbFall linear both; }
      @keyframes fbShine { 0% { left: -60%; } 100% { left: 120%; } }
      @keyframes fbBurst { 0% { transform: translate(-50%, -50%) scale(.2); opacity: 0; } 40% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
      @keyframes fbFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(760px) rotate(var(--rot)); opacity: 0; } }
      .fb-pos { position: relative; font-size: 34px; font-weight: 800; color: var(--accent); text-shadow: 0 2px 8px #000; }
      @keyframes fbIn { 0% { transform: translateX(-50%) scale(2.2); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
      .lights { display: flex; justify-content: center; gap: 14px; margin-bottom: 10px; }
      .lamp { width: 26px; height: 26px; border-radius: 50%; background: #2a1414; border: 3px solid #0b0b0b; box-shadow: inset 0 -3px 6px rgba(0,0,0,.5); }
      .lamp.red { background: radial-gradient(circle at 35% 35%, #ffb3b3, #ff1f1f 60%, #8a0000); box-shadow: 0 0 18px #ff2a2a, 0 0 4px #ff8a8a; }
      .lamp.green { background: radial-gradient(circle at 35% 35%, #d6ffe0, #22e05a 60%, #0a6b2a); box-shadow: 0 0 22px #22ff66; }
      .cd { font-size: 96px; line-height: 1; display: inline-block; animation: cdpop .75s cubic-bezier(.2,1.6,.4,1) both; }
      .cd.go { font-size: 120px; font-style: italic; color: #6dff8a; text-shadow: 0 0 22px #22ff66, 0 3px 10px #000; animation: gopop .9s ease-out both; }
      @keyframes cdpop { 0% { transform: scale(2.4); opacity: 0; } 45% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes gopop { 0% { transform: scale(2.8) skewX(-8deg); opacity: 0; } 35% { transform: scale(.9) skewX(-8deg); opacity: 1; } 100% { transform: scale(1) skewX(-8deg); opacity: 0; } }
      .hud-bottom { position: absolute; left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; }
      .pad { display: flex; gap: 10px; }
      .pad-btn { width: 96px; height: 96px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); background: rgba(16,24,32,0.55); color: var(--text); font-size: 15px; font-weight: 700; touch-action: none; }
      .pad-btn.gas { background: rgba(60, 170, 90, 0.6); }
      .pad-btn.brake { background: rgba(200, 70, 70, 0.6); }
      .pad-btn.nitro-btn { background: rgba(60, 130, 230, 0.6); }
      .nitro { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 112px); width: min(280px, 60vw); pointer-events: none; }
      .nitro-label { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 2px; }
      .nitro-bar { height: 10px; background: #2c3e50; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
      .nitro-bar > div { height: 100%; background: linear-gradient(90deg, #3b82f6, #67e8f9); transition: width 0.1s; }
      .pad-btn:active { filter: brightness(1.3); }
      .speed { text-align: center; background: var(--panel); border-radius: 12px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
      .speed > div:first-child { font-size: 26px; color: var(--text); font-weight: 700; }
      .dur { width: 120px; height: 8px; background: #2c3e50; border-radius: 4px; overflow: hidden; margin: 6px auto 2px; }
      .dur > div { height: 100%; background: var(--pos); transition: width 0.2s; }
      .dur > div.low { background: var(--neg); }
      .dur-label { font-size: 12px; }
      .toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(16, 24, 32, 0.45); border: 1px solid rgba(255, 179, 0, 0.5); color: rgba(238, 243, 247, 0.9); padding: 10px 16px; border-radius: 10px; z-index: 10; }
      .toast.solid { background: var(--panel); border-color: var(--accent); color: var(--text); }
      .toast[hidden] { display: none; }
      @media (max-width: 480px) {
        .pad-btn { width: 56px; height: 56px; font-size: 11px; }
        .pad { gap: 6px; align-items: flex-end; }
        /* 親指で押しやすいように、ブレーキ・ニトロを大きく、アクセルを一番大きく */
        .pad-btn.brake { width: 74px; height: 74px; font-size: 13px; }
        .pad-btn.gas { width: 86px; height: 86px; font-size: 15px; font-weight: 800; }
        .pad-btn.nitro-btn { width: 74px; height: 74px; font-size: 13px; }
        .hud-bottom { gap: 4px; }
        .speed { padding: 6px 8px; min-width: 0; white-space: nowrap; }
        .speed > div:first-child { font-size: 20px; }
        .dur-label { display: none; }
        /* 狭い画面では、ニトロをアクセルの上に置いて、画面の外へはみ出さないようにする */
        .nitro-btn { position: absolute; right: 4px; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 96px); }
        .title { font-size: 44px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
